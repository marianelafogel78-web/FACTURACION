<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Facturación / Pedidos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            max-width: 600px;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin: auto;
        }
        .logo-container {
            text-align: center;
            margin-bottom: 20px;
        }
        /* Estilo para asegurar que la imagen no rompa el diseño */
        .logo-container img {
            max-width: 150px;
            height: auto;
        }
        .form-group {
            position: relative;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        /* Contenedor de sugerencias desplegables */
        #suggestions-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #fff;
            border: 1px solid #ccc;
            border-top: none;
            z-index: 1000;
            max-height: 150px;
            overflow-y: auto;
            border-radius: 0 0 4px 4px;
            display: none;
        }
        .suggestion-item {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
        }
        .suggestion-item:hover {
            background-color: #f0f0f0;
        }

        /* Estilos específicos para impresión */
        @media print {
            body {
                background: none;
                color: #000;
            }
            .container {
                box-shadow: none;
                margin: 0;
                width: 100%;
                max-width: 100%;
            }
            /* Si la imagen da problemas al imprimir, puedes ocultarla descomentando la línea de abajo */
            /* img { display: none !important; } */
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Imagen / Logo (Asegúrate de colocar un enlace válido en src o dejarlo listo) -->
    <div class="logo-container">
        <img src="https://via.placeholder.com/150" alt="Logo de la Empresa" id="print-logo">
    </div>

    <h2>Búsqueda de Productos</h2>
    
    <div class="form-group">
        <label for="product-search">Escribe el nombre del producto:</label>
        <input type="text" id="product-search" placeholder="Ej. Camisa, Pantalón..." autocomplete="off">
        <div id="suggestions-list"></div>
    </div>
</div>

<script>
    // Tu JSON con los productos y precios
    const productosJSON = [
        { "id": 1, "nombre": "Camisa Casual de Algodón", "precio": 25.00 },
        { "id": 2, "nombre": "Pantalón Jean Clásico", "precio": 40.00 },
        { "id": 3, "nombre": "Zapatillas Deportivas", "precio": 65.50 },
        { "id": 4, "nombre": "Gorra Ajustable", "precio": 15.00 },
        { "id": 5, "nombre": "Campera / Chaqueta Impermeable", "precio": 85.00 }
    ];

    const searchInput = document.getElementById('product-search');
    const suggestionsList = document.getElementById('suggestions-list');

    // Evento para detectar cuando escribes
    searchInput.addEventListener('input', function() {
        const query = this.value.toLowerCase().trim();
        
        // Limpiar lista si no hay texto
        if (query.length === 0) {
            suggestionsList.innerHTML = '';
            suggestionsList.style.display = 'none';
            return;
        }

        // Filtrar productos del JSON que coincidan con la búsqueda
        const resultados = productosJSON.filter(item => 
            item.nombre.toLowerCase().includes(query)
        );

        // Mostrar resultados en el desplegable
        if (resultados.length > 0) {
            suggestionsList.innerHTML = '';
            resultados.forEach(item => {
                const div = document.createElement('div');
                div.classList.add('suggestion-item');
                div.innerHTML = `<strong>${item.nombre}</strong> - $${item.precio.toFixed(2)}`;
                
                // Al hacer clic en una opción, se rellena el input
                div.addEventListener('click', function() {
                    searchInput.value = item.nombre;
                    suggestionsList.innerHTML = '';
                    suggestionsList.style.display = 'none';
                    console.log("Producto seleccionado:", item);
                });

                suggestionsList.appendChild(div);
            });
            suggestionsList.style.display = 'block';
        } else {
            suggestionsList.innerHTML = '<div class="suggestion-item">No se encontraron productos</div>';
            suggestionsList.style.display = 'block';
        }
    });

    // Ocultar la lista si se hace clic fuera
    document.addEventListener('click', function(e) {
        if (!e.target.closest('.form-group')) {
            suggestionsList.style.display = 'none';
        }
    });
</script>

</body>
</html>
